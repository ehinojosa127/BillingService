# Confecciones Erika — orquestación Docker
#
# Este archivo se ejecuta desde la carpeta padre de los tres repos:
#
#   parent/
#     docker-compose.yaml   ← copiar desde BillingService/stack/
#     .env                  ← copiar desde BillingService/stack/.env.example
#     docker/               ← copiar desde BillingService/stack/docker/
#     erp-api/
#     erp-front/
#     BillingService/
#
# Setup rápido: ver BillingService/stack/README.md

name: confecciones-erika

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d postgres && psql -U $$POSTGRES_USER -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='billing'\" | grep -q 1 && psql -U $$POSTGRES_USER -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='erp'\" | grep -q 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  billing:
    build:
      context: ./BillingService
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./BillingService/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: billing
      DB_USERNAME: ${POSTGRES_USER:-root}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_ROOT: /app/storage
      SUNAT_CERTIFICATE_PATH: /certs/sunat-beta-signing.pfx
    volumes:
      - billing_storage:/app/storage
      - ./BillingService/certs:/certs:ro
    expose:
      - "8080"
    ports:
      - "5147:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  erp-api:
    build:
      context: ./erp-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      billing:
        condition: service_healthy
    env_file:
      - ./erp-api/.env
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: erp
      DB_USERNAME: ${POSTGRES_USER:-root}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      FILESYSTEM_DISK: local
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      BILLING_SERVICE_URL: http://billing:8080
      BILLING_SERVICE_TIMEOUT: "60"
    volumes:
      - erp_storage:/var/www/html/storage/app
    expose:
      - "80"
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up')?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  erp-front:
    build:
      context: ./erp-front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      erp-api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  erp_storage:
  billing_storage:
